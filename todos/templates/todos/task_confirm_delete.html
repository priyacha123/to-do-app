{% extends 'todos/base.html' %}

{% block title %}Delete Task{% endblock %}

{% block content %}
<h1>Delete "{{ task.title }}"?</h1>
<form method="POST">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, delete</button>
    <a href="{% url 'task_list' %}" class="btn btn-outline-secondary">Cancel</a>
</form>
{% endblock %}
