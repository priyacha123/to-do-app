{% extends 'todos/base.html' %}

{% block title %}Task Form{% endblock %}

{% block content %}
<main class="auth-wrap"><section class="auth-card">
    <div class="eyebrow">Taskflow</div>
    <h1>Plan something good.</h1>
    <p>Add a task, set its priority, and choose optional due-date reminders or repetition.</p>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="primary-btn">Save task</button>
        <a href="{% url 'task_list' %}" class="logout" style="margin-left:14px;">Cancel</a>
    </form>
</section></main>
{% endblock %}
