<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Taskflow{% endblock %}</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'todos/styles.css' %}">
</head>
<body class="app-shell">
    {% if user.is_authenticated %}
    <header class="topbar">
        <a class="brand" href="{% url 'task_list' %}"><span class="brand-mark">✓</span> taskflow</a>
        <div class="user-menu">
            <span class="avatar">{{ user.username|first|upper }}</span>
            <span class="user-name">{{ user.username }}</span>
            <form method="POST" action="{% url 'logout' %}">
                {% csrf_token %}
                <button type="submit" class="logout" style="background:none;border:0;">Log out</button>
            </form>
        </div>
    </header>
    {% endif %}
    {% block content %}{% endblock %}
</body>
</html>
