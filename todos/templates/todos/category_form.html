{% extends 'todos/base.html' %}

{% block title %}New Category · Taskflow{% endblock %}

{% block content %}
<main class="auth-wrap">
    <section class="auth-card">
        <div class="eyebrow">Organize your work</div>
        <h1>Create a category.</h1>
        <p>Use categories to group similar tasks and find them faster.</p>
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="primary-btn">Create category</button>
            <a href="{% url 'task_list' %}" class="logout" style="margin-left:14px;">Cancel</a>
        </form>
    </section>
</main>
{% endblock %}
