{% extends 'todos/base.html' %}
{% block content %}
<main class="auth-wrap"><section class="auth-card">
    <div class="eyebrow">Start fresh</div>
    <h1>Make space for what matters.</h1>
    <p>Set up your personal task list in a few seconds.</p>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="primary-btn">Create account</button>
    </form>
</section></main>
{% endblock %}
